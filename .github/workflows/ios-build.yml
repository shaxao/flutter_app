name: VoiceFlow iOS Build & Sign

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'development'
        type: choice
        options:
        - development
        - adhoc
        - release

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.5'
        channel: 'stable'
    
    - name: Flutter Doctor
      run: flutter doctor -v
    
    - name: Cache pub
      uses: actions/cache@v4
      with:
        path: |
          ~/.pub-cache
        key: ${{ runner.os }}-pub-${{ github.run_id }}
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Flutter build bundle
      run: flutter build bundle --release
    
    - name: Cache CocoaPods
      uses: actions/cache@v4
      with:
        path: |
          ios/Pods
          ~/Library/Caches/CocoaPods
          ~/.cocoapods
        key: ${{ runner.os }}-pods-${{ github.run_id }}
    
    - name: Install CocoaPods
      run: |
        pod repo update
        pod install
      working-directory: ios
    
    - name: Precache iOS artifacts
      run: flutter precache --ios
    
    - name: Xcode build (codesign disabled)
      run: |
        xcodebuild \
          -workspace ios/Runner.xcworkspace \
          -scheme Runner \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_STYLE=Manual \
          CODE_SIGN_IDENTITY= \
          DEVELOPMENT_TEAM= \
          archive -archivePath build/Runner.xcarchive
    
    - name: Create unsigned IPA
      run: |
        mkdir -p Payload
        cp -R build/Runner.xcarchive/Products/Applications/Runner.app Payload/Runner.app
        zip -r VoiceFlow-unsigned.ipa Payload
    
    - name: Upload unsigned IPA
      uses: actions/upload-artifact@v4
      with:
        name: VoiceFlow-unsigned-IPA
        path: VoiceFlow-unsigned.ipa
        retention-days: 30

  test-web:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.5'
        channel: 'stable'
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Build Web
      run: flutter build web
    
    - name: Upload Web Build
      uses: actions/upload-artifact@v4
      with:
        name: VoiceFlow-Web
        path: build/web
        retention-days: 30
